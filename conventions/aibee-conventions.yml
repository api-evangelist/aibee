error_envelope:
  detail: errors/aibee-error-codes.yml
  summary: >-
    Two inconsistent vendor envelopes. deploy.aibee.cn returns {error_no, error_msg,
    func_exec_time, data} with error_no 0 on success; guide-admin.aibee.cn returns {request_id,
    error_no, error_msg, data} with error_no 200 on success. Neither is RFC 9457.
