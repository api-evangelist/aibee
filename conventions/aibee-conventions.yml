description: >-
  Cross-cutting runtime semantics for the only Aibee surfaces a third party can reach: the
  hosted map-data endpoints the published @aibee/bmap SDK calls, and the AIBEENav JSBridge the
  published @aibee/rn-nav-sdk injects. Aibee publishes no API reference, no OpenAPI and no
  conventions document, so everything here is derived from first-party published SDK code plus
  probed responses, and every gap is recorded as a gap rather than filled in.
surfaces:
