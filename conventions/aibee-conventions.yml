idempotency:
  coverage: none
  mechanism: null
  header: null
  scope: []
  detail: >-
    No replay-protection mechanism exists on any reachable Aibee surface. There is no
    Idempotency-Key header, no client-supplied request token, and no documented retry
    semantics. This is stated as `none` rather than `na` because the surface is not purely
    read-only in principle — Aibee operates admin and BI consoles (guide-admin.aibee.cn,
    mall.aibee.cn, ai.aibee.cn) whose write APIs sit behind a login we did not cross — but
    nothing a third party can reach documents or provides idempotency. No Idempotency pointer
    is emitted.
dry_run_mode:
  supported: none
  detail: No test/sandbox mode, no simulation flag, no fixture tooling is published.
reversibility:
  grade: na
  detail: >-
    Every operation reachable and documented on Aibee's public surface is a read: the map-data
    endpoints return venue, floor and conversion data, and the AIBEENav JSBridge methods
    manipulate device state on the caller's own handset (Bluetooth, permissions, screen-on,
    iBeacon scanning) rather than mutating any Aibee-held record. There is therefore no write
    to reverse, no cancel/refund/void/undo/restore operation to document, and no window to
    state. Marked `na` rather than `none`: an honest not-applicable, not a missing control.
    Should Aibee publish its admin/console write APIs, this must be re-derived.
  write_surface_found: false
  reversal_operations: []
