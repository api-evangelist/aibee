auth_style:
  model: none-observed
  detail: >-
    The two probed map-data endpoints answered anonymously — no API key, no bearer token, no
    cookie, no Referer or Origin check defeated the probe. Aibee documents no authentication
    scheme anywhere public. The AR SDK constructor accepts an undocumented `socketToken` option,
    and the React Native SDK requires Amap (高德) application keys, but those are Amap's
    credentials obtained from the Amap open platform, not Aibee credentials. No Authentication
    artifact or pointer is emitted, because there is no documented auth model to describe.
