description: >-
  Standards and compliance assertions. Aibee publishes no OpenAPI, so there is nothing to derive
  conformance from; this file records what the search actually found and — more usefully — what
  it did not. No certification, audit report, trust center or security program is published
  anywhere on Aibee's public surface, so NO Compliance and NO TrustCenter pointer is emitted.
  Domain-standard conformance is not asserted: indoor mapping and wayfinding has candidate
  standards (OGC IndoorGML, IMDF) and Aibee's contract declares neither, but the surface carries
  no contract at all, so this is a not-measured rather than a fail.
entries:
- id: pipl
  name: Personal Information Protection Law of the PRC
  conforms: true
  evidence: https://www.aibee.cn/clause.html
  detail: >-
    The privacy policy states Aibee collects, uses and protects personal information under the
    laws and regulations of the People's Republic of China (excluding Hong Kong, Macau and
    Taiwan). The legal notice at https://www.aibee.cn/legal.html adds that, outside of data it
    processes under a customer's instruction, Aibee does not itself collect, use, store,
    transmit or disclose personal information, and that the customer issues its own privacy
    text to data subjects. This is a self-declared legal posture, not an audited certification.
