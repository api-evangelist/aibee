description: >-
  First-party Aibee (爱笔智能) client libraries, published to the public npm registry under the
  @aibee scope. Ownership is not inferred from the scope name: every package in the scope shares
  the same six npm maintainers (jyfang, hujingn, wukang0718, kxiaoaibee, yfdjcxj, zcjia), and the
  packages that declare a repository point at Aibee's own GitLab at https://code.aibee.cn
  (robot-fe/map/bmap.git, ued/owlly), with author metadata of "Aibee Inc." and rpeng@aibee.com.
  These are the map, indoor-navigation and AR SDKs behind Aibee's AI Mall OS / commercial
  metaverse products. Aibee also operates a private registry at https://npm.aibee.cn (referenced
  in the @aibee/bmap README and package scripts) which does not resolve publicly, so some SDKs
  documented on map.aibee.cn — notably @aibee/miniapp-ar-sdk — are NOT on the public registry.
  version + published read from registry.npmjs.org at fetch time.
ownership_check:
  registry_scope: '@aibee'
  shared_maintainers:
  - jyfang
  - hujingn
  - wukang0718
  - kxiaoaibee
  - yfdjcxj
  - zcjia
  first_party_evidence:
  - '@aibee/bmap repository.url = https://code.aibee.cn/robot-fe/map/bmap.git'
  - '@aibee/bmap author.email = rpeng@aibee.com'
  - '@aibee/rn-nav-sdk author = "Aibee Inc."'
  - '@aibee/owlly + @aibee/owlly-navigation repository.url = https://code.aibee.cn/ued/owlly'
  - '@aibee/bmap README documentation URL = https://map.aibee.cn/sdk-docs/bmap/docs/ (live, HTTP 200)'
