aid: aibee
name: Aibee
description: >-
  Aibee (爱笔智能, 爱笔（北京）智能科技有限公司) is a Beijing-based artificial-intelligence company founded in
  November 2017 by Dr. Yuanqing Lin, the former head of Baidu Research, that digitizes and
  automates physical commercial space. It fuses computer vision, multi-modal sensing, indoor
  positioning, 3D reconstruction, speech and big-data analytics into AI Mall OS and AI Parking OS
  — indoor 3D "reality maps", AR wayfinding, smart parking and find-my-car, and precise
  footfall/customer-flow analytics — deployed across shopping malls, parking garages, office
  towers, bank branches, automotive 4S dealerships, chain retail stores, airports, scenic areas
  and high-speed-rail stations. Its public developer surface is client-side rather than a REST
  platform: a first-party @aibee npm scope of indoor-map, AR-navigation and React Native
  navigation SDKs, and a public SDK reference at map.aibee.cn. No OpenAPI, GraphQL SDL, MCP
  server or agent card is published.
