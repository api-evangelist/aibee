apis:
- name: Aibee BMap Indoor Map Data
  description: >-
    The hosted map-data surface behind Aibee's indoor map and wayfinding products. It is not
    documented as a public API and has no published reference or specification; it is recorded
    here because Aibee's own publicly distributed SDK, @aibee/bmap on npm, calls it by absolute
    URL, and because both endpoints answer anonymously over HTTPS with JSON. Venue and floor
    metadata comes from deploy.aibee.cn (/function/place-service/getPlacesInfo) and map
    conversion/geometry from guide-admin.aibee.cn (/bmap/get_convert, /bmap/convert/getFloorData).
    Everything is scoped by place_id and floor_id. No OpenAPI exists and none has been authored.
  image: https://www.aibee.cn/logo-blue.9fb45835.png
  humanURL: https://map.aibee.cn/sdk-docs/bmap/docs/
  baseURL: https://deploy.aibee.cn
  tags:
  - Indoor Mapping
  - Location Services
  - Commercial Real Estate
  tags_raw:
  - indoor-mapping
  - location-services
  - commercial-real-estate
  properties:
  - type: APIReference
    url: https://map.aibee.cn/sdk-docs/bmap/docs/
  - type: Conventions
    url: conventions/aibee-conventions.yml
  - type: ErrorCatalog
    url: errors/aibee-error-codes.yml
- name: Aibee AR Navigation SDK
  description: >-
    Aibee's all-scene AR indoor-wayfinding SDK for web and WeChat mini-programs, published with a
    full public reference (quickstart, constructor, events, methods, and the map, camera, model
    and particle component APIs). An ArController is constructed with a place_id and a container
    element and renders a live-camera AR route overlay, a compass, a 2D map and 3D/particle
    effects over PDR or VIO indoor positioning, switching floors automatically. The reference is
    public; the package itself (@aibee/miniapp-ar-sdk) is not on the public npm registry.
  image: https://www.aibee.cn/logo-blue.9fb45835.png
  humanURL: https://map.aibee.cn/sdk-docs/
  baseURL: https://map.aibee.cn
  tags:
  - Augmented Reality
  - Indoor Navigation
  - SDK
  tags_raw:
